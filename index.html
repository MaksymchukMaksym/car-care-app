<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CarCare - Сканер авто</title>

  <!-- Стилі -->
  <link rel="stylesheet" href="css/style.css">

  <!-- PWA конфігурація -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="theme-color" content="#fafafa">
</head>

<body>
<!-- ВАШ КОНТЕНТ -->
<div id="app">
  <h1>Lüftungsanlagen</h1>
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <h1>🚗 CarCare</h1>
    <a href="admin.html" style="
        background: #667eea;
        color: white;
        padding: 10px 20px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 600;
        font-size: 14px;
        transition: all 0.3s;
    " onmouseover="this.style.background='#5a67d8'" onmouseout="this.style.background='#667eea'">
      ⚙️ Адмін
    </a>
  </div>
  <!-- Елементи для сканування -->
  <div id="reader" style="width: 100%; max-width: 500px; margin: 0 auto;"></div>
  <button id="startScanBtn">📷 Сканувати QR-код</button>
  <div id="result"></div>
</div>

<!-- ПІДКЛЮЧЕННЯ СКРИПТІВ -->
<!-- Спочатку бібліотека -->
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<!-- ПОТІМ ваш код (він має бути ОСТАННІМ!) -->
<script src="js/app.js"></script>
</body>
</html>
