<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CarCare PWA</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f0f2f5; padding: 20px; }
    #app { max-width: 600px; margin: 0 auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .header h1 { color: #1a1a2e; }
    .admin-link { background: #667eea; color: white; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-size: 14px; }
    #reader { width: 100%; max-width: 400px; margin: 0 auto; background: #000; border-radius: 12px; overflow: hidden; min-height: 300px; }
    #reader video { width: 100% !important; }
    .controls { display: flex; gap: 10px; justify-content: center; margin: 15px 0; flex-wrap: wrap; }
    .btn { padding: 12px 24px; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; }
    .btn:hover { transform: translateY(-2px); }
    .btn-primary { background: #667eea; color: white; }
    .btn-secondary { background: #e2e8f0; color: #333; }
    .btn-success { background: #48bb78; color: white; }
    .result-box { margin-top: 15px; padding: 15px; border-radius: 10px; display: none; }
    .result-box.success { display: block; background: #d4edda; color: #155724; }
    .result-box.error { display: block; background: #f8d7da; color: #721c24; }
    .result-box.warning { display: block; background: #fff3cd; color: #856404; }
    .footer { text-align: center; padding: 20px; color: #888; font-size: 13px; margin-top: 20px; }
  </style>
</head>
<body>
<div id="app">
  <div class="header">
    <h1>🚗 CarCare</h1>
    <a href="admin.html" class="admin-link">⚙️ Admin</a>
  </div>

  <div id="reader"></div>

  <div class="controls">
    <button id="startScanBtn" class="btn btn-primary">📷 QR scannen</button>
    <button id="stopScanBtn" class="btn btn-secondary" style="display:none;">⏹ Stop</button>
  </div>

  <div id="result" class="result-box"></div>

  <div class="footer">© 2026 CarCare - PWA mit Firebase</div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
