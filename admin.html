<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin-Panel</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f0f2f5; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    h1 { color: #1a1a2e; margin-bottom: 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .back-btn { background: #667eea; color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; }
    .section { background: #f8f9fa; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
    .section h2 { margin-bottom: 15px; font-size: 18px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-weight: 500; margin-bottom: 4px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px; font-family: inherit; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #667eea; }
    .form-group textarea { resize: vertical; min-height: 80px; }
    .btn { padding: 10px 24px; border: none; border-radius: 8px; cursor: pointer; font-weight: 500; transition: 0.3s; }
    .btn:hover { transform: translateY(-2px); }
    .btn-primary { background: #667eea; color: white; }
    .btn-success { background: #48bb78; color: white; }
    .btn-danger { background: #fc8181; color: white; }
    .btn-secondary { background: #e2e8f0; color: #333; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .qr-result { margin-top: 20px; padding: 20px; background: white; border-radius: 10px; text-align: center; display: none; }
    .qr-result.show { display: block; }
    #qrCodeContainer { display: flex; justify-content: center; padding: 20px; background: white; border-radius: 10px; }
    #qrCodeContainer img { max-width: 250px; }
    .installation-item { display: flex; justify-content: space-between; padding: 12px; background: white; border-radius: 8px; margin-bottom: 8px; border-left: 4px solid #667eea; }
    .installation-item .info { flex: 1; }
    .installation-item .info .name { font-weight: 600; }
    .installation-item .info .id { font-size: 13px; color: #666; }
    .installation-item .actions { display: flex; gap: 8px; }
    .btn-sm { padding: 6px 12px; font-size: 12px; }
    .qr-label { font-weight: 600; margin-top: 10px; color: #1a1a2e; }
    .note { background: #fff3cd; padding: 12px; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid #ffc107; }
    @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>Admin-Panel</h1>
    <a href="index.html" class="back-btn">Zurück</a>
  </div>

  <!-- Hinzufügen -->
  <div class="section">
    <h2>Anlage hinzufügen</h2>
    <form id="addForm">
      <div class="grid-2">
        <div class="form-group">
          <label>ID *</label>
          <input type="text" id="instId" placeholder="RLT-7-001" required>
        </div>
        <div class="form-group">
          <label>Name *</label>
          <input type="text" id="instName" placeholder="RLT 7 Büro 9200" required>
        </div>
        <div class="form-group">
          <label>Projekt</label>
          <input type="text" id="project" placeholder="Brain Box Berlin">
        </div>
        <div class="form-group">
          <label>Artikelnummer (Ang-Nr)</label>
          <input type="text" id="articleNumber" placeholder="180695ugA1">
        </div>
        <div class="form-group">
          <label>Marke</label>
          <input type="text" id="brand" placeholder="WOLF">
        </div>
        <div class="form-group">
          <label>Herstellungsdatum</label>
          <input type="date" id="manufactureDate">
        </div>
        <div class="form-group">
          <label>Gesamtgewicht (kg)</label>
          <input type="number" id="totalWeight" placeholder="4667">
        </div>
        <div class="form-group">
          <label>LV-Pos</label>
          <input type="text" id="lvPos" placeholder="1.2.8">
        </div>
        <div class="form-group">
          <label>Leistung (m³/h)</label>
          <input type="number" id="capacity" placeholder="9200">
        </div>
        <div class="form-group">
          <label>Modell</label>
          <input type="text" id="instModel" placeholder="RLT 7">
        </div>
        <div class="form-group">
          <label>Baujahr</label>
          <input type="number" id="instYear" placeholder="2024">
        </div>
      </div>
      <div class="form-group">
        <label>Filterwechseldatum</label>
        <input type="date" id="filterDate">
      </div>
      <div class="form-group">
        <label>Verantwortlicher</label>
        <input type="text" id="responsible" placeholder="Max Mustermann">
      </div>
      <div class="form-group">
        <label>Notizen</label>
        <textarea id="notes" placeholder="Gerät wird nach Skizze gefügelt..."></textarea>
      </div>
      <div class="form-group">
        <label>Zeichnung (PDF)</label>
        <input type="file" id="drawingFile" accept=".pdf">
      </div>
      <button type="submit" class="btn btn-primary">Hinzufügen</button>
    </form>
  </div>

  <!-- QR-Generierung -->
  <div class="section">
    <h2>QR-Generierung</h2>

    <div class="note">
      <strong>Wichtig:</strong> Der QR-Code wird mit der Anlagen-ID generiert. Laden Sie ihn herunter und drucken Sie ihn aus, um ihn auf die Anlage zu kleben.
    </div>

    <div class="form-group">
      <label>Anlage auswählen</label>
      <select id="installSelect">
        <option value="">-- Bitte wählen --</option>
      </select>
    </div>

    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <button onclick="generateQR()" class="btn btn-primary">QR erstellen</button>
    </div>

    <div id="qrResult" class="qr-result">
      <h3>QR-Code:</h3>
      <div id="qrCodeContainer"></div>
      <div id="qrLabel" class="qr-label"></div>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:15px;">
        <button onclick="downloadQR()" class="btn btn-success" id="downloadBtn" style="display:none;">Herunterladen</button>
        <button onclick="printQR()" class="btn btn-secondary" id="printBtn" style="display:none;">Drucken</button>
      </div>
    </div>
  </div>

  <!-- Liste -->
  <div class="section">
    <h2>Alle Anlagen</h2>
    <div id="installationsList"></div>
  </div>
</div>

<!-- Passwortschutz -->
<script>
  const ADMIN_PASSWORD = '123456'; // Ändern Sie das Passwort!

  function checkPassword() {
    const input = prompt('Admin-Passwort eingeben:');
    if (input !== ADMIN_PASSWORD) {
      document.body.innerHTML = `
        <div style="text-align:center;margin-top:100px;padding:40px;font-family:Arial;">
          <h1 style="color:red;">ZUGANG VERWEIGERT</h1>
          <p style="color:#666;margin-top:10px;">Falsches Passwort.</p>
          <button onclick="location.reload()" style="margin-top:20px;padding:10px 30px;background:#667eea;color:white;border:none;border-radius:8px;cursor:pointer;">Erneut versuchen</button>
        </div>
      `;
      return false;
    }
    return true;
  }
  checkPassword();
</script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
