<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Адмін-панель</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f0f2f5; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    h1 { color: #1a1a2e; margin-bottom: 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .back-btn { background: #667eea; color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; }
    .section { background: #f8f9fa; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
    .section h2 { margin-bottom: 15px; font-size: 18px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-weight: 500; margin-bottom: 4px; }
    .form-group input, .form-group select { width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px; }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: #667eea; }
    .btn { padding: 10px 24px; border: none; border-radius: 8px; cursor: pointer; font-weight: 500; transition: 0.3s; }
    .btn:hover { transform: translateY(-2px); }
    .btn-primary { background: #667eea; color: white; }
    .btn-success { background: #48bb78; color: white; }
    .btn-danger { background: #fc8181; color: white; }
    .btn-secondary { background: #e2e8f0; color: #333; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .qr-result { margin-top: 20px; padding: 20px; background: white; border-radius: 10px; text-align: center; display: none; }
    .qr-result.show { display: block; }
    #qrCodeContainer { display: flex; justify-content: center; padding: 20px; background: white; border-radius: 10px; }
    #qrCodeContainer img { max-width: 250px; }
    .installation-item { display: flex; justify-content: space-between; padding: 12px; background: white; border-radius: 8px; margin-bottom: 8px; border-left: 4px solid #667eea; }
    .installation-item .info { flex: 1; }
    .installation-item .info .name { font-weight: 600; }
    .installation-item .info .id { font-size: 13px; color: #666; }
    .installation-item .actions { display: flex; gap: 8px; }
    .btn-sm { padding: 6px 12px; font-size: 12px; }
    .qr-label { font-weight: 600; margin-top: 10px; color: #1a1a2e; }
    .test-btn { background: #ed8936; color: white; }
    .test-btn:hover { background: #dd6b20; }
    .note { background: #fff3cd; padding: 12px; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid #ffc107; }
    @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>⚙️ Адмін-панель</h1>
    <a href="index.html" class="back-btn">← На головну</a>
  </div>

  <!-- Додавання -->
  <div class="section">
    <h2>➕ Додати установку</h2>
    <form id="addForm">
      <div class="grid-2">
        <div class="form-group">
          <label>ID *</label>
          <input type="text" id="instId" placeholder="INST-001" required>
        </div>
        <div class="form-group">
          <label>Назва *</label>
          <input type="text" id="instName" placeholder="Вентиляційна система" required>
        </div>
        <div class="form-group">
          <label>Модель</label>
          <input type="text" id="instModel" placeholder="Ventilator Pro">
        </div>
        <div class="form-group">
          <label>Рік</label>
          <input type="number" id="instYear" placeholder="2024">
        </div>
      </div>
      <div class="form-group">
        <label>Дата заміни фільтра</label>
        <input type="date" id="filterDate">
      </div>
      <button type="submit" class="btn btn-primary">➕ Додати</button>
    </form>
  </div>

  <!-- Генерація QR -->
  <div class="section">
    <h2>📱 Генерація QR</h2>

    <div class="note">
      <strong>⚠️ Важливо:</strong> Після створення QR-коду, обов'язково <strong>скачайте</strong> його та
      <strong>роздрукуйте</strong> в хорошій якості. QR має бути чітким та контрастним.
    </div>

    <div class="form-group">
      <label>Виберіть установку</label>
      <select id="installSelect">
        <option value="">-- Виберіть --</option>
      </select>
    </div>

    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <button onclick="generateQR()" class="btn btn-primary">🎯 Створити QR</button>
      <button onclick="generateTestQR()" class="btn test-btn">🧪 Тестовий QR</button>
    </div>

    <div id="qrResult" class="qr-result">
      <h3>QR-код:</h3>
      <div id="qrCodeContainer"></div>
      <div id="qrLabel" class="qr-label"></div>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:15px;">
        <button onclick="downloadQR()" class="btn btn-success" id="downloadBtn" style="display:none;">⬇️ Скачати</button>
        <button onclick="printQR()" class="btn btn-secondary" id="printBtn" style="display:none;">🖨️ Друк</button>
      </div>
    </div>
  </div>

  <!-- Список -->
  <div class="section">
    <h2>📋 Всі установки</h2>
    <div id="installationsList"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
  // ==================== ДАНІ ====================
  function getInstallations() {
    try {
      const data = localStorage.getItem('installations');
      return data ? JSON.parse(data) : [];
    } catch { return []; }
  }

  function saveInstallations(data) {
    localStorage.setItem('installations', JSON.stringify(data));
  }

  function getInstallation(id) {
    return getInstallations().find(i => i.id === id) || null;
  }

  // ==================== ДОДАВАННЯ ====================
  document.getElementById('addForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const id = document.getElementById('instId').value.trim();
    const name = document.getElementById('instName').value.trim();

    if (!id || !name) {
      alert('Заповніть ID та назву');
      return;
    }

    if (getInstallation(id)) {
      alert(`ID "${id}" вже існує!`);
      return;
    }

    const data = getInstallations();
    data.push({
      id: id,
      name: name,
      model: document.getElementById('instModel').value.trim() || '—',
      year: document.getElementById('instYear').value.trim() || '—',
      filterDate: document.getElementById('filterDate').value || '',
      createdAt: new Date().toISOString()
    });

    saveInstallations(data);
    this.reset();
    renderList();
    updateSelect();
    alert(`✅ Додано: ${id}`);
  });

  // ==================== QR ====================
  let currentQR = null;

  function generateQR() {
    const id = document.getElementById('installSelect').value;
    if (!id) { alert('Виберіть установку'); return; }

    const inst = getInstallation(id);
    if (!inst) { alert('Установку не знайдено'); return; }

    currentQR = inst;
    createQR(id);
  }

  function generateTestQR() {
    const id = 'TEST-001';
    // Додаємо тестову якщо немає
    if (!getInstallation(id)) {
      const data = getInstallations();
      data.push({
        id: id,
        name: 'Тестова установка',
        model: 'Тест',
        year: '2024',
        filterDate: '',
        createdAt: new Date().toISOString()
      });
      saveInstallations(data);
      renderList();
      updateSelect();
    }
    currentQR = getInstallation(id);
    createQR(id);
  }

  function createQR(text) {
    const container = document.getElementById('qrCodeContainer');
    container.innerHTML = '';

    new QRCode(container, {
      text: text,
      width: 250,
      height: 250,
      colorDark: "#000000",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });

    document.getElementById('qrLabel').textContent = `ID: ${text}`;
    document.getElementById('qrResult').classList.add('show');
    document.getElementById('downloadBtn').style.display = 'inline-flex';
    document.getElementById('printBtn').style.display = 'inline-flex';
  }

  function downloadQR() {
    const canvas = document.querySelector('#qrCodeContainer canvas');
    if (!canvas) { alert('QR не знайдено'); return; }

    const link = document.createElement('a');
    link.download = `QR-${currentQR?.id || 'code'}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  }

  function printQR() {
    const canvas = document.querySelector('#qrCodeContainer canvas');
    if (!canvas) { alert('QR не знайдено'); return; }

    const win = window.open('', '_blank');
    win.document.write(`
                <html><head><title>Друк QR</title></head>
                <body style="text-align:center;padding:50px;font-family:Arial;">
                    <img src="${canvas.toDataURL('image/png')}" style="max-width:300px;padding:20px;border:1px solid #ddd;border-radius:10px;">
                    <p style="font-size:20px;font-weight:600;margin-top:20px;">${currentQR?.id || ''}</p>
                    <p style="color:#666;">${currentQR?.name || ''}</p>
                    <script>window.onload = function() { setTimeout(window.print, 500); } <\/script>
                </body></html>
            `);
    win.document.close();
  }

  // ==================== СПИСОК ====================
  function renderList() {
    const container = document.getElementById('installationsList');
    const data = getInstallations();

    if (!data.length) {
      container.innerHTML = '<p style="text-align:center;color:#666;">Немає установок</p>';
      return;
    }

    container.innerHTML = data.map(i => `
                <div class="installation-item">
                    <div class="info">
                        <div class="name">${i.name}</div>
                        <div class="id">ID: ${i.id} | Модель: ${i.model}</div>
                        <div class="id">Фільтр: ${i.filterDate ? new Date(i.filterDate).toLocaleDateString('uk-UA') : 'Не встановлено'}</div>
                    </div>
                    <div class="actions">
                        <button onclick="selectAndGenerate('${i.id}')" class="btn btn-primary btn-sm">📱 QR</button>
                        <button onclick="deleteInstallation('${i.id}')" class="btn btn-danger btn-sm">🗑️</button>
                    </div>
                </div>
            `).join('');
  }

  function deleteInstallation(id) {
    if (!confirm(`Видалити ${id}?`)) return;
    const data = getInstallations().filter(i => i.id !== id);
    saveInstallations(data);
    renderList();
    updateSelect();
    document.getElementById('qrResult').classList.remove('show');
  }

  function selectAndGenerate(id) {
    document.getElementById('installSelect').value = id;
    generateQR();
  }

  function updateSelect() {
    const select = document.getElementById('installSelect');
    const val = select.value;
    select.innerHTML = '<option value="">-- Виберіть --</option>';
    getInstallations().forEach(i => {
      select.innerHTML += `<option value="${i.id}">${i.id} - ${i.name}</option>`;
    });
    if (val) select.value = val;
  }

  // ==================== ІНІЦ ====================
  document.addEventListener('DOMContentLoaded', function() {
    renderList();
    updateSelect();
  });
</script>
</body>
</html>
