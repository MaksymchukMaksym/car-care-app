<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Адмін-панель</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f0f2f5; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    h1 { color: #1a1a2e; margin-bottom: 20px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
    .back-btn { background: #667eea; color: white; padding: 10px 20px; border-radius: 8px; text-decoration: none; }
    .section { background: #f8f9fa; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
    .section h2 { margin-bottom: 15px; font-size: 18px; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-weight: 500; margin-bottom: 4px; }
    .form-group input, .form-group select { width: 100%; padding: 10px; border: 2px solid #ddd; border-radius: 8px; font-size: 14px; }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: #667eea; }
    .btn { padding: 10px 24px; border: none; border-radius: 8px; cursor: pointer; font-weight: 500; transition: 0.3s; }
    .btn:hover { transform: translateY(-2px); }
    .btn-primary { background: #667eea; color: white; }
    .btn-success { background: #48bb78; color: white; }
    .btn-danger { background: #fc8181; color: white; }
    .btn-secondary { background: #e2e8f0; color: #333; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .qr-result { margin-top: 20px; padding: 20px; background: white; border-radius: 10px; text-align: center; display: none; }
    .qr-result.show { display: block; }
    #qrCodeContainer { display: flex; justify-content: center; padding: 20px; background: white; border-radius: 10px; }
    #qrCodeContainer img { max-width: 250px; }
    .installation-item { display: flex; justify-content: space-between; padding: 12px; background: white; border-radius: 8px; margin-bottom: 8px; border-left: 4px solid #667eea; }
    .installation-item .info { flex: 1; }
    .installation-item .info .name { font-weight: 600; }
    .installation-item .info .id { font-size: 13px; color: #666; }
    .installation-item .actions { display: flex; gap: 8px; }
    .btn-sm { padding: 6px 12px; font-size: 12px; }
    .qr-label { font-weight: 600; margin-top: 10px; color: #1a1a2e; }
    .test-btn { background: #ed8936; color: white; }
    .test-btn:hover { background: #dd6b20; }
    .sync-status {
      background: #e2e8f0;
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 12px;
      display: inline-block;
      margin-bottom: 15px;
    }
    .sync-status.online { background: #d4edda; color: #155724; }
    .sync-status.offline { background: #f8d7da; color: #721c24; }
    .note { background: #fff3cd; padding: 12px; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid #ffc107; }
    @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>⚙️ Адмін-панель</h1>
    <a href="index.html" class="back-btn">← На головну</a>
  </div>

  <div id="syncStatus" class="sync-status">🔄 Синхронізація...</div>

  <!-- Додавання -->
  <div class="section">
    <h2>➕ Додати установку</h2>
    <form id="addForm">
      <div class="grid-2">
        <div class="form-group">
          <label>ID *</label>
          <input type="text" id="instId" placeholder="INST-001" required>
        </div>
        <div class="form-group">
          <label>Назва *</label>
          <input type="text" id="instName" placeholder="Вентиляційна система" required>
        </div>
        <div class="form-group">
          <label>Модель</label>
          <input type="text" id="instModel" placeholder="Ventilator Pro">
        </div>
        <div class="form-group">
          <label>Рік</label>
          <input type="number" id="instYear" placeholder="2024">
        </div>
      </div>
      <div class="form-group">
        <label>Дата заміни фільтра</label>
        <input type="date" id="filterDate">
      </div>
      <button type="submit" class="btn btn-primary">➕ Додати</button>
    </form>
  </div>

  <!-- Генерація QR -->
  <div class="section">
    <h2>📱 Генерація QR</h2>

    <div class="note">
      <strong>⚠️ Важливо:</strong> QR-код генерується з ID установки. Скачайте його та роздрукуйте для наклеювання на обладнання.
    </div>

    <div class="form-group">
      <label>Виберіть установку</label>
      <select id="installSelect">
        <option value="">-- Виберіть --</option>
      </select>
    </div>

    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <button onclick="generateQR()" class="btn btn-primary">🎯 Створити QR</button>
      <button onclick="generateTestQR()" class="btn test-btn">🧪 Тестовий QR</button>
    </div>

    <div id="qrResult" class="qr-result">
      <h3>QR-код:</h3>
      <div id="qrCodeContainer"></div>
      <div id="qrLabel" class="qr-label"></div>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:15px;">
        <button onclick="downloadQR()" class="btn btn-success" id="downloadBtn" style="display:none;">⬇️ Скачати</button>
        <button onclick="printQR()" class="btn btn-secondary" id="printBtn" style="display:none;">🖨️ Друк</button>
      </div>
    </div>
  </div>

  <!-- Список -->
  <div class="section">
    <h2>📋 Всі установки</h2>
    <div id="installationsList"></div>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="js/firebase-config.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
