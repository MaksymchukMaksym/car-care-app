<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Інформація про установку</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: Arial, sans-serif; background: #f0f2f5; padding: 20px; }
    #app { max-width: 600px; margin: 0 auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    .back-btn { background: #e2e8f0; color: #333; padding: 10px 20px; border-radius: 8px; border: none; cursor: pointer; font-size: 14px; margin-bottom: 20px; }
    .back-btn:hover { background: #cbd5e0; }
    .field { padding: 12px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
    .field .label { color: #666; }
    .field .value { font-weight: 600; }
    .status { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 13px; }
    .status-good { background: #d4edda; color: #155724; }
    .status-warning { background: #fff3cd; color: #856404; }
    .status-danger { background: #f8d7da; color: #721c24; }
    .filter-section { margin-top: 20px; padding-top: 20px; border-top: 2px solid #eee; }
    .filter-section h3 { margin-bottom: 15px; }
    .date-row { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; }
    .date-row input { flex: 1; padding: 10px; border: 2px solid #ddd; border-radius: 8px; min-width: 150px; }
    .date-row input:focus { outline: none; border-color: #667eea; }
    .date-row button { padding: 10px 20px; background: #48bb78; color: white; border: none; border-radius: 8px; cursor: pointer; }
    .date-row button:hover { background: #38a169; }
    .msg { display: none; background: #d4edda; color: #155724; padding: 10px; border-radius: 8px; margin-top: 10px; }
    .msg.show { display: block; }
    .loading { text-align: center; padding: 40px 0; color: #666; }
    .sync-status {
      background: #e2e8f0;
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 12px;
      display: inline-block;
      margin-bottom: 15px;
    }
    .sync-status.online { background: #d4edda; color: #155724; }
    .sync-status.offline { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
<div id="app">
  <button onclick="location.href='index.html'" class="back-btn">← На головну</button>
  <h1>🔧 Інформація</h1>

  <div id="syncStatus" class="sync-status">🔄 Синхронізація...</div>
  <div id="info"><div class="loading">Завантаження...</div></div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="js/firebase-config.js"></script>

<script>
  // ==================== ОТРИМАННЯ ID ====================
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id') || params.get('vin');
  console.log('📌 ID з URL:', id);

  // ==================== ВІДОБРАЖЕННЯ ====================
  async function render() {
    const container = document.getElementById('info');

    if (!id) {
      container.innerHTML = '<div class="loading">❌ ID не вказано</div>';
      return;
    }

    const inst = await getInstallation(id);
    if (!inst) {
      container.innerHTML = `
                    <div class="loading">
                        ❌ Установку "${id}" не знайдено<br>
                        <button onclick="location.href='admin.html'" class="back-btn" style="margin-top:15px;">Додати в адмін-панелі</button>
                    </div>
                `;
      return;
    }

    const status = getStatus(inst.filterDate);

    container.innerHTML = `
                <div class="field"><span class="label">ID</span><span class="value">${inst.id}</span></div>
                <div class="field"><span class="label">Назва</span><span class="value">${inst.name}</span></div>
                <div class="field"><span class="label">Модель</span><span class="value">${inst.model}</span></div>
                <div class="field"><span class="label">Рік</span><span class="value">${inst.year}</span></div>
                <div class="field"><span class="label">Створено</span><span class="value">${formatDate(inst.createdAt)}</span></div>

                <div class="filter-section">
                    <h3>🔄 Заміна фільтра</h3>
                    <div class="field"><span class="label">Поточна дата</span><span class="value" id="filterDisplay">${inst.filterDate ? formatDate(inst.filterDate) : 'Не встановлено'}</span></div>
                    <div class="field"><span class="label">Статус</span><span class="status ${status.class}">${status.text}</span></div>

                    <div class="date-row">
                        <input type="date" id="newDate" value="${inst.filterDate || ''}">
                        <button onclick="updateFilter()">🔄 Оновити</button>
                    </div>
                    <div id="msg" class="msg">✅ Дату оновлено!</div>
                </div>
            `;
  }

  // ==================== ОНОВЛЕННЯ ДАТИ ====================
  async function updateFilter() {
    const date = document.getElementById('newDate').value;
    if (!date) { alert('Виберіть дату'); return; }

    const inst = await getInstallation(id);
    if (!inst) { alert('Установку не знайдено'); return; }

    inst.filterDate = date;
    inst.lastUpdate = new Date().toISOString();

    await saveInstallation(inst);

    document.getElementById('msg').classList.add('show');
    setTimeout(() => document.getElementById('msg').classList.remove('show'), 3000);
    render();
  }

  // ==================== ДОПОМІЖНІ ====================
  function getStatus(date) {
    if (!date) return { text: '❓ Не встановлено', class: 'status-warning' };
    const days = Math.floor((new Date() - new Date(date)) / (1000*60*60*24));
    if (days < 0) return { text: '✅ Актуальний', class: 'status-good' };
    if (days <= 30) return { text: `⚠️ ${days} днів тому`, class: 'status-warning' };
    return { text: `🔴 ПОТРІБНА ЗАМІНА (${days} днів)`, class: 'status-danger' };
  }

  function formatDate(d) {
    if (!d) return '—';
    return new Date(d).toLocaleDateString('uk-UA');
  }

  // ==================== ЗАПУСК ====================
  document.addEventListener('DOMContentLoaded', render);
</script>
</body>
</html>
