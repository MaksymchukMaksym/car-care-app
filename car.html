<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Інформація про установку</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .car-details {
      padding: 20px 0;
    }
    .car-details .field {
      padding: 12px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
    }
    .car-details .field .label {
      color: #666;
      font-weight: 500;
    }
    .car-details .field .value {
      color: #1a1a2e;
      font-weight: 600;
    }
    .back-btn {
      background: #e0e0e0;
      color: #333;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 15px;
      font-size: 16px;
      text-decoration: none;
      display: inline-block;
    }
    .back-btn:hover {
      background: #d0d0d0;
    }
    .filter-section {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 2px solid #eee;
    }
    .filter-section h3 {
      margin-bottom: 15px;
      color: #1a1a2e;
    }
    .filter-section .date-input {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .filter-section .date-input input {
      flex: 1;
      padding: 10px;
      border: 2px solid #ddd;
      border-radius: 8px;
      min-width: 150px;
    }
    .filter-section .date-input input:focus {
      outline: none;
      border-color: #667eea;
    }
    .filter-section .date-input button {
      flex: 0 0 auto;
      padding: 10px 20px;
      width: auto;
      background: #48bb78;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s;
    }
    .filter-section .date-input button:hover {
      background: #38a169;
      transform: translateY(-2px);
    }
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
    }
    .status-good {
      background: #c6f6d5;
      color: #22543d;
    }
    .status-warning {
      background: #fefcbf;
      color: #744210;
    }
    .status-danger {
      background: #fed7d7;
      color: #742a2a;
    }
    .success-msg {
      display: none;
      background: #c6f6d5;
      color: #22543d;
      padding: 10px;
      border-radius: 8px;
      margin-top: 10px;
    }
    .success-msg.show {
      display: block;
    }
    .loading {
      text-align: center;
      padding: 40px 0;
    }
    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .error-box {
      text-align: center;
      padding: 40px 0;
      color: #c33;
    }
    .error-box .icon {
      font-size: 48px;
      margin-bottom: 20px;
    }
    @media (max-width: 600px) {
      .filter-section .date-input {
        flex-direction: column;
      }
      .filter-section .date-input button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
<div id="app" style="max-width:600px;margin:0 auto;padding:20px;">
  <button onclick="location.href='index.html'" class="back-btn">← На головну</button>
  <h1>🔧 Інформація про установку</h1>

  <div id="carInfo" class="car-details">
    <div class="loading">
      <div class="spinner"></div>
      <p>Завантаження...</p>
    </div>
  </div>
</div>

<script>
  // ============================================
  // РОБОТА З ДАНИМИ (дублюємо тут для надійності)
  // ============================================
  function getInstallations() {
    try {
      const data = localStorage.getItem('installations');
      return data ? JSON.parse(data) : [];
    } catch (e) {
      return [];
    }
  }

  function getInstallation(id) {
    const installations = getInstallations();
    return installations.find(inst => inst.id === id) || null;
  }

  function saveInstallations(installations) {
    localStorage.setItem('installations', JSON.stringify(installations));
  }

  // ============================================
  // ОТРИМУЄМО ID З URL
  // ============================================
  const urlParams = new URLSearchParams(window.location.search);
  const id = urlParams.get('id') || urlParams.get('vin');

  console.log('📌 ID з URL:', id);

  // ============================================
  // ГОЛОВНА ФУНКЦІЯ ВІДОБРАЖЕННЯ
  // ============================================
  function displayCarInfo(id, installation) {
    const container = document.getElementById('carInfo');

    if (!installation) {
      container.innerHTML = `
                <div class="error-box">
                    <div class="icon">❌</div>
                    <h2>Установку не знайдено</h2>
                    <p style="color:#666;margin-top:10px;">Перевірте правильність ID</p>
                    <button onclick="location.href='index.html'" class="back-btn" style="margin-top:20px;">← На головну</button>
                </div>
            `;
      return;
    }

    console.log('📊 Дані установки:', installation);

    const filterStatus = getFilterStatus(installation.filterDate);

    container.innerHTML = `
            <div class="field">
                <span class="label">ID установки</span>
                <span class="value">${installation.id}</span>
            </div>
            <div class="field">
                <span class="label">Назва</span>
                <span class="value">${installation.name || 'Невідомо'}</span>
            </div>
            <div class="field">
                <span class="label">Модель</span>
                <span class="value">${installation.model || 'Невідомо'}</span>
            </div>
            <div class="field">
                <span class="label">Рік випуску</span>
                <span class="value">${installation.year || 'Невідомо'}</span>
            </div>
            <div class="field">
                <span class="label">Серійний номер</span>
                <span class="value">${installation.serial || '—'}</span>
            </div>
            <div class="field">
                <span class="label">Розташування</span>
                <span class="value">${installation.location || '—'}</span>
            </div>
            <div class="field">
                <span class="label">Дата створення</span>
                <span class="value">${formatDate(installation.createdAt)}</span>
            </div>

            <div class="filter-section">
                <h3>🔄 Заміна фільтра</h3>
                <div class="field">
                    <span class="label">Поточна дата заміни</span>
                    <span class="value" id="filterDateDisplay">${installation.filterDate ? formatDate(installation.filterDate) : 'Не встановлено'}</span>
                </div>
                <div class="field">
                    <span class="label">Статус</span>
                    <span class="status-badge ${filterStatus.class}">${filterStatus.text}</span>
                </div>

                <div class="date-input">
                    <input type="date" id="newFilterDate" value="${installation.filterDate || ''}">
                    <button onclick="updateFilterDate('${installation.id}')">🔄 Оновити дату</button>
                </div>
                <div id="updateMsg" class="success-msg">✅ Дату заміни оновлено!</div>
            </div>

            <div style="margin-top:20px;text-align:center;">
                <button onclick="location.href='index.html'" class="back-btn" style="display:inline-block;">← На головну</button>
            </div>
        `;
  }

  // ============================================
  // ОНОВЛЕННЯ ДАТИ ЗАМІНИ
  // ============================================
  function updateFilterDate(installationId) {
    if (!installationId) return;

    const newDate = document.getElementById('newFilterDate').value;
    if (!newDate) {
      alert('Будь ласка, виберіть дату');
      return;
    }

    const installations = getInstallations();
    const index = installations.findIndex(inst => inst.id === installationId);

    if (index === -1) {
      alert('Установку не знайдено');
      return;
    }

    // Оновлюємо дату
    installations[index].filterDate = newDate;
    installations[index].lastUpdate = new Date().toISOString();

    // Додаємо в історію
    if (!installations[index].history) {
      installations[index].history = [];
    }
    installations[index].history.push({
      date: newDate,
      updatedAt: new Date().toISOString()
    });

    saveInstallations(installations);

    // Показуємо повідомлення
    const msg = document.getElementById('updateMsg');
    msg.classList.add('show');
    setTimeout(() => msg.classList.remove('show'), 3000);

    // Оновлюємо відображення
    displayCarInfo(installationId, installations[index]);
  }

  // ============================================
  // ДОПОМІЖНІ ФУНКЦІЇ
  // ============================================
  function formatDate(dateString) {
    if (!dateString) return 'Не вказано';
    const date = new Date(dateString);
    return date.toLocaleDateString('uk-UA', {
      day: '2-digit',
      month: '2-digit',
      year: 'numeric'
    });
  }

  function getFilterStatus(filterDate) {
    if (!filterDate) {
      return { text: '❓ Не встановлено', class: 'status-warning' };
    }

    const today = new Date();
    const filter = new Date(filterDate);
    const daysDiff = Math.floor((today - filter) / (1000 * 60 * 60 * 24));

    if (daysDiff < 0) {
      return { text: '✅ Актуальний', class: 'status-good' };
    } else if (daysDiff <= 30) {
      return { text: `⚠️ ${daysDiff} днів тому`, class: 'status-warning' };
    } else if (daysDiff <= 60) {
      return { text: `🔴 Потрібна заміна (${daysDiff} днів)`, class: 'status-danger' };
    } else {
      return { text: `🚨 ТЕРМІНОВО! (${daysDiff} днів)`, class: 'status-danger' };
    }
  }

  // ============================================
  // ІНІЦІАЛІЗАЦІЯ СТОРІНКИ
  // ============================================
  document.addEventListener('DOMContentLoaded', function() {
    if (!id) {
      document.getElementById('carInfo').innerHTML = `
                <div class="error-box">
                    <div class="icon">❓</div>
                    <h2>ID не вказано</h2>
                    <p style="color:#666;margin-top:10px;">Будь ласка, відскануйте QR-код</p>
                    <button onclick="location.href='index.html'" class="back-btn" style="margin-top:20px;">← На головну</button>
                </div>
            `;
      return;
    }

    const installation = getInstallation(id);
    displayCarInfo(id, installation);
  });

  // Експортуємо функції для використання в HTML
  window.updateFilterDate = updateFilterDate;
  window.getInstallation = getInstallation;
  window.getInstallations = getInstallations;
</script>
</body>
</html>
